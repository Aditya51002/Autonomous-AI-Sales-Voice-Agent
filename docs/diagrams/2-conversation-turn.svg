<text x="744" y="328.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<circle cx="404" cy="324" r="12" fill="#1b64be" stroke="#fff" stroke-width="2"/>
<text x="404" y="328.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">7</text>
