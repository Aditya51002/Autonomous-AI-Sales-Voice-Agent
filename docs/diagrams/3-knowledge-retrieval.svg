<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 690" width="1400" height="690" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans Devanagari', sans-serif" role="img" aria-label="Knowledge retrieval (RAG)">
<defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#68707f"/></marker><marker id="dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#68707f"/></marker></defs>
<rect width="100%" height="100%" rx="14" fill="#ffffff"/>
<text x="40" y="44" font-size="24" fill="#16181d" font-weight="700" text-anchor="start">Knowledge retrieval (RAG)</text>
<text x="40" y="70" font-size="14" fill="#596070" font-weight="400" text-anchor="start">Documents are indexed once. Each question is then matched against them.</text>
<rect x="30" y="100" width="1340" height="175" rx="16" fill="#fdf6dc" fill-opacity="0.35" stroke="#bd8b00" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="46" y="125" font-size="12" fill="#bd8b00" font-weight="700" text-anchor="start">A · WHEN A DOCUMENT IS UPLOADED</text>
<rect x="55" y="145" width="220" height="100" rx="10" fill="#e8f1fd" stroke="#2f7fd8" stroke-width="1.8" data-box="1"/>
<text x="165.0" y="183.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Upload</text>
<text x="165.0" y="202.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">PDF, DOCX, MD, TXT</text>
<text x="165.0" y="219.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">up to 5 MB</text>
<rect x="323" y="145" width="220" height="100" rx="10" fill="#fdf6dc" stroke="#bd8b00" stroke-width="1.8" data-box="1"/>
<text x="433.0" y="183.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Extract text</text>
<text x="433.0" y="202.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">pypdf and</text>
<text x="433.0" y="219.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">python-docx</text>
<rect x="591" y="145" width="220" height="100" rx="10" fill="#fdf6dc" stroke="#bd8b00" stroke-width="1.8" data-box="1"/>
<text x="701.0" y="183.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Split into passages</text>
<text x="701.0" y="202.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Up to 220 words,</text>
<text x="701.0" y="219.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">headings kept</text>
<rect x="859" y="145" width="220" height="100" rx="10" fill="#fdf6dc" stroke="#bd8b00" stroke-width="1.8" data-box="1"/>
<text x="969.0" y="183.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Create vectors</text>
<text x="969.0" y="202.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">multilingual-e5-large</text>
<text x="969.0" y="219.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">runs locally</text>
<rect x="1127" y="145" width="220" height="100" rx="10" fill="#eef0f3" stroke="#707887" stroke-width="1.8" data-box="1"/>
<text x="1237.0" y="183.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Store</text>
<text x="1237.0" y="202.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">knowledge.db: text,</text>
<text x="1237.0" y="219.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">vectors, keywords</text>
<rect x="30" y="300" width="1340" height="360" rx="16" fill="#e3f6f1" fill-opacity="0.35" stroke="#0f9c7e" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="46" y="325" font-size="12" fill="#0f9c7e" font-weight="700" text-anchor="start">B · WHEN THE CALLER ASKS A QUESTION</text>
<rect x="55" y="420" width="210" height="100" rx="10" fill="#e8f1fd" stroke="#2f7fd8" stroke-width="1.8" data-box="1"/>
<text x="160.0" y="458.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Question</text>
<text x="160.0" y="477.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Growth plan की</text>
<text x="160.0" y="494.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">कीमत कितनी है?</text>
<rect x="335" y="345" width="230" height="90" rx="10" fill="#e3f6f1" stroke="#0f9c7e" stroke-width="1.8" data-box="1"/>
<text x="450.0" y="378.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Meaning search</text>
<text x="450.0" y="397.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Compare vectors,</text>
<text x="450.0" y="414.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">best 20</text>
<rect x="335" y="505" width="230" height="90" rx="10" fill="#e3f6f1" stroke="#0f9c7e" stroke-width="1.8" data-box="1"/>
<text x="450.0" y="538.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Keyword search</text>
<text x="450.0" y="557.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">BM25 word match,</text>
<text x="450.0" y="574.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">best 20</text>
<rect x="635" y="420" width="210" height="100" rx="10" fill="#e3f6f1" stroke="#0f9c7e" stroke-width="1.8" data-box="1"/>
<text x="740.0" y="458.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Merge rankings</text>
<text x="740.0" y="477.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Reciprocal rank</text>
<text x="740.0" y="494.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">fusion</text>
<rect x="915" y="420" width="190" height="100" rx="10" fill="#ffffff" stroke="#c3c9d3" stroke-width="1.8" data-box="1"/>
<text x="1010.0" y="458.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Close enough?</text>
<text x="1010.0" y="477.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Similarity</text>
<text x="1010.0" y="494.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">0.78 or higher</text>
<rect x="1170" y="345" width="180" height="100" rx="10" fill="#e5f7e7" stroke="#1a8f2e" stroke-width="1.8" data-box="1"/>
<text x="1260.0" y="374.5" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Yes</text>
<text x="1260.0" y="393.5" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Top 4 passages</text>
<text x="1260.0" y="410.5" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">go to Gemini,</text>
<text x="1260.0" y="427.5" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">which answers</text>
<rect x="1170" y="505" width="180" height="100" rx="10" fill="#fdeaea" stroke="#d03b3c" stroke-width="1.8" data-box="1"/>
<text x="1260.0" y="534.5" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">No</text>
<text x="1260.0" y="553.5" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Defer to a</text>
<text x="1260.0" y="570.5" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">specialist; log</text>
<text x="1260.0" y="587.5" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">the question</text>
<text x="55" y="637" font-size="13.5" fill="#596070" font-weight="400" text-anchor="start">Tested on 16 sample passages: correct passage in the top 4 for 24 of 25 questions; 7 of 8 unrelated questions rejected.</text>
