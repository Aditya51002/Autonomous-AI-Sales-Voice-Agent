<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans Devanagari', sans-serif" role="img" aria-label="Lead qualification and sentiment">
<defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#68707f"/></marker><marker id="dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#68707f"/></marker></defs>
<rect width="100%" height="100%" rx="14" fill="#ffffff"/>
<text x="40" y="44" font-size="24" fill="#16181d" font-weight="700" text-anchor="start">Lead qualification and sentiment</text>
<text x="40" y="70" font-size="14" fill="#596070" font-weight="400" text-anchor="start">The model reports what was said. Fixed rules decide the score.</text>
<rect x="55" y="105" width="220" height="100" rx="10" fill="#e8f1fd" stroke="#2f7fd8" stroke-width="1.8" data-box="1"/>
<text x="165.0" y="143.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Caller says</text>
<text x="165.0" y="162.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">“I am the owner,</text>
<text x="165.0" y="179.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">budget ₹2,000 a month”</text>
<rect x="323" y="105" width="220" height="100" rx="10" fill="#fff0e5" stroke="#e2711d" stroke-width="1.8" data-box="1"/>
<text x="433.0" y="143.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Gemini extracts</text>
<text x="433.0" y="162.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Facts with quoted</text>
<text x="433.0" y="179.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">words, plus sentiment</text>
<rect x="591" y="105" width="220" height="100" rx="10" fill="#e3f6f1" stroke="#0f9c7e" stroke-width="1.8" data-box="1"/>
<text x="701.0" y="143.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Evidence check</text>
<text x="701.0" y="162.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Quote must appear in</text>
<text x="701.0" y="179.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">the caller&#x27;s words</text>
<rect x="859" y="105" width="220" height="100" rx="10" fill="#e3f6f1" stroke="#0f9c7e" stroke-width="1.8" data-box="1"/>
<text x="969.0" y="143.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Merge</text>
<text x="969.0" y="162.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Add to what is</text>
<text x="969.0" y="179.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">already known</text>
<rect x="1127" y="105" width="220" height="100" rx="10" fill="#e3f6f1" stroke="#0f9c7e" stroke-width="1.8" data-box="1"/>
<text x="1237.0" y="143.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Score</text>
<text x="1237.0" y="162.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Fixed rules,</text>
<text x="1237.0" y="179.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">out of 100</text>
<rect x="30" y="245" width="900" height="350" rx="16" fill="#e3f6f1" fill-opacity="0.35" stroke="#0f9c7e" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="46" y="270" font-size="12" fill="#0f9c7e" font-weight="700" text-anchor="start">HOW THE POINTS ARE GIVEN</text>
<text x="60" y="314" font-size="15" fill="#16181d" font-weight="650" text-anchor="start">Need</text>
<text x="150" y="314" font-size="13" fill="#596070" font-weight="400" text-anchor="start">30 points</text>
<rect x="250" y="301" width="600" height="16" rx="4" fill="#257de0"/>
<text x="250" y="341" font-size="12.5" fill="#596070" font-weight="400" text-anchor="start">Specific problem 30 · general interest 15</text>
<text x="60" y="386" font-size="15" fill="#16181d" font-weight="650" text-anchor="start">Budget</text>
<text x="150" y="386" font-size="13" fill="#596070" font-weight="400" text-anchor="start">25 points</text>
<rect x="250" y="373" width="500" height="16" rx="4" fill="#257de0"/>
<text x="250" y="413" font-size="12.5" fill="#596070" font-weight="400" text-anchor="start">Covers a plan 25 · no amount 10 · too low 5</text>
<text x="60" y="458" font-size="15" fill="#16181d" font-weight="650" text-anchor="start">Authority</text>
<text x="150" y="458" font-size="13" fill="#596070" font-weight="400" text-anchor="start">20 points</text>
<rect x="250" y="445" width="400" height="16" rx="4" fill="#257de0"/>
<text x="250" y="485" font-size="12.5" fill="#596070" font-weight="400" text-anchor="start">Decides or influences 20 · not involved 5</text>
<text x="60" y="530" font-size="15" fill="#16181d" font-weight="650" text-anchor="start">Timeline</text>
<text x="150" y="530" font-size="13" fill="#596070" font-weight="400" text-anchor="start">25 points</text>
<rect x="250" y="517" width="500" height="16" rx="4" fill="#257de0"/>
<text x="250" y="557" font-size="12.5" fill="#596070" font-weight="400" text-anchor="start">Within 3 months 25 · 3–6 months 15 · later 5</text>
<text x="60" y="578" font-size="12.5" fill="#596070" font-weight="400" text-anchor="start">An unknown fact scores 0.</text>
<rect x="1000" y="255" width="360" height="65" rx="10" fill="#e5f7e7" stroke="#1a8f2e" stroke-width="1.8" data-box="1"/>
<text x="1180.0" y="284.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Hot · 70 or more</text>
<text x="1180.0" y="303.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Sales should follow up first</text>
<rect x="1000" y="335" width="360" height="65" rx="10" fill="#fdf6dc" stroke="#bd8b00" stroke-width="1.8" data-box="1"/>
<text x="1180.0" y="364.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Warm · 40 to 69</text>
<text x="1180.0" y="383.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Interested, details missing</text>
<rect x="1000" y="415" width="360" height="65" rx="10" fill="#eef0f3" stroke="#707887" stroke-width="1.8" data-box="1"/>
<text x="1180.0" y="444.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Cold · below 40</text>
<text x="1180.0" y="463.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Little sign of a purchase</text>
<rect x="1000" y="515" width="360" height="80" rx="10" fill="#fdeaea" stroke="#d03b3c" stroke-width="1.8" data-box="1"/>
<text x="1180.0" y="543.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Sentiment, shown separately</text>
<text x="1180.0" y="562.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Two negative turns in a row</text>
<text x="1180.0" y="579.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">flag the call for a person</text>
<rect x="55" y="625" width="620" height="65" rx="10" fill="#eef0f3" stroke="#707887" stroke-width="1.8" data-box="1"/>
<text x="365.0" y="654.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Saved to leads.db</text>
<text x="365.0" y="673.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Sensitive numbers and email addresses redacted</text>
<rect x="725" y="625" width="635" height="65" rx="10" fill="#e3f6f1" stroke="#0f9c7e" stroke-width="1.8" data-box="1"/>
<text x="1042.5" y="654.0" font-size="14.5" fill="#16181d" font-weight="650" text-anchor="middle">Used immediately</text>
<text x="1042.5" y="673.0" font-size="12.5" fill="#596070" font-weight="400" text-anchor="middle">Lead panel updates; the agent asks for one missing fact</text>
